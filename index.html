<style>
/* Layout: on a phone the screen is the card (one phrase, Back and Next always in reach);
   on an iPad or Mac a section rail on the left and the section's phrases in a grid. */
:root {
  --bg: #EFE9DC;          /* cream ground */
  --surface: #F7F3EA;     /* raised paper */
  --line: #D6CCB6;
  --line-strong: #A99C7F;
  --ink: #1C2420;
  --ink-2: #4D5751;
  --accent: #0B6B3F;      /* Saudi green, deepened for text */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE6D9;
  --ring: rgba(11,107,63,.22);
  --wrong: #A6382E;        /* a wrong quiz answer */
  --wrong-soft: #F1DEDA;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --arabic: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", "Arabic Typesetting", serif;
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --en-size: 1.5rem;
  --ar-size: 2.15rem;
  --tr-size: 1.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #18201C; --line: #2B3630; --line-strong: #56675D; --ink: #EEE8DC; --ink-2: #AFB9B2;
    --accent: #5CC995; --accent-ink: #0B1710; --accent-soft: #1E3328; --ring: rgba(92,201,149,.25);
    --wrong: #E8867A; --wrong-soft: #3A2320;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #18201C; --line: #2B3630; --line-strong: #56675D; --ink: #EEE8DC; --ink-2: #AFB9B2;
  --accent: #5CC995; --accent-ink: #0B1710; --accent-soft: #1E3328; --ring: rgba(92,201,149,.25);
  --wrong: #E8867A; --wrong-soft: #3A2320;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui);
  font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
#app { height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible + .knob, .toc button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2 { text-wrap: balance; }
p { margin: 0; }
.ar { font-family: var(--arabic); direction: rtl; text-align: right; unicode-bidi: plaintext; }

/* ---------- shared pieces ---------- */
.who { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.who button { padding: 9px 14px; border-radius: 999px; font-weight: 500; font-size: .95rem; white-space: nowrap; color: var(--ink-2); }
.who button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.fixed-who { font-size: .95rem; font-weight: 500; color: var(--ink-2); text-align: center; }
.who .sm { display: none; }
@media (max-width: 359px) { .who .lg { display: none; } .who .sm { display: inline; } }
@media (max-width: 419px) { .who.kin .lg { display: none; } .who.kin .sm { display: inline; } }

.play { position: relative; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; flex: none; transition: transform .12s ease; }
.play:active { transform: scale(.95); }
.play .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.play .track { fill: none; stroke: transparent; stroke-width: 3; }
.play .prog { fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; opacity: 0; }
.play.on .prog { opacity: .9; }
/* a clip on its way: the ring turns until the sound starts */
.play.loading .prog { opacity: .9; stroke-dashoffset: 72 !important; transform-origin: 32px 32px; animation: turning .9s linear infinite; }
@keyframes turning { to { transform: rotate(360deg); } }
.tile.loading { animation: breathe 1s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .play.loading .prog, .tile.loading { animation: none; } }
.play .glyph { width: 22px; height: 22px; position: relative; }
.play[disabled] { background: var(--surface); color: var(--ink-2); border: 1px dashed var(--line); cursor: default; }
/* listen & repeat: the gap for the learner shows as a counting-down ring on a pale button */
.play.turn { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.play.turn .prog { opacity: .9; stroke: var(--accent); }
.tile.turn { border-color: var(--accent); border-style: dashed; }
.slot { display: grid; min-width: 0; }
.slot > * { grid-area: 1 / 1; }
.slot .chips { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot .cue { display: none; align-self: center; font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--accent); }
.actions.gap .chips { visibility: hidden; }
.actions.gap .cue { display: block; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
  font-weight: 500; font-size: .95rem; color: var(--ink-2); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.tag { font-size: .92rem; color: var(--ink-2); }
.tag b { font-weight: 600; color: var(--ink); }
.missing { font-size: .92rem; color: var(--ink-2); }

.en { font-family: var(--display); font-weight: 500; font-size: var(--en-size); line-height: 1.25; letter-spacing: -.005em; }
.label { font-weight: 600; font-size: .95rem; color: var(--accent); }
.label .letters { font-family: var(--arabic); font-weight: 500; font-size: 1.3em; margin-inline-start: .35em; }
.say .ar { color: var(--accent); font-size: var(--ar-size); line-height: 1.75; font-weight: 500; }
.say .tr { font-size: var(--tr-size); line-height: 1.4; color: var(--ink); font-style: italic; font-family: var(--display); }

.reveal { width: 100%; border: 1.5px dashed var(--line-strong); border-radius: 16px; padding: 22px 18px; text-align: left;
  color: var(--ink-2); font-weight: 500; background: transparent; }
.reveal span { display: block; color: var(--ink); font-family: var(--display); font-size: 1.15rem; margin-bottom: 4px; }

.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 400; font-size: .95rem; color: var(--ink-2); line-height: 1.3; }
.switch b { font-weight: 600; color: var(--ink); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .knob { width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(18px); }

/* ---------- phone ---------- */
.phone { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.top .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); }
.top .back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); padding: 6px 2px; }
.top .where { text-align: right; min-width: 0; font-size: .92rem; color: var(--ink-2); line-height: 1.25; }
.top .where b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { overflow: hidden; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.stage .body { display: flex; flex-direction: column; gap: 14px; }
.stage .say { display: flex; flex-direction: column; gap: 6px; }
.stage .actions { margin-top: auto; display: flex; align-items: center; gap: 14px; }
.stage .play { width: 68px; height: 68px; }
.stage .play .glyph { width: 26px; height: 26px; }
.dock { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--bg); }
.dock .nav { font-weight: 600; padding: 12px 8px; border-radius: 12px; color: var(--accent); }
.dock .nav:disabled { color: var(--line); cursor: default; }
.dock .prev { justify-self: start; }
.dock .next { justify-self: end; }
.dock .who button { padding: 9px 12px; }

.stage[data-fit="1"] { --en-size: 1.36rem; --ar-size: 1.95rem; --tr-size: 1.04rem; gap: 14px; }
.stage[data-fit="2"] { --en-size: 1.24rem; --ar-size: 1.75rem; --tr-size: .98rem; gap: 12px; }
.stage[data-fit="3"] { --en-size: 1.14rem; --ar-size: 1.58rem; --tr-size: .93rem; gap: 10px; padding-top: 14px; }
.stage[data-fit="4"] { --en-size: 1.05rem; --ar-size: 1.42rem; --tr-size: .88rem; gap: 8px; padding-top: 10px; }
.stage[data-fit="4"] .say .ar { line-height: 1.6; }
.stage[data-fit="1"] .tile, .stage[data-fit="2"] .tile { padding: 6px 6px 8px; }
.stage[data-fit="2"] .tile .ar, .stage[data-fit="3"] .tile .ar, .stage[data-fit="4"] .tile .ar { font-size: 1.12rem; line-height: 1.45; }
.stage[data-fit="3"] .tile, .stage[data-fit="4"] .tile { padding: 4px 6px 6px; }
.stage[data-fit="3"] .pain-q .ar, .stage[data-fit="4"] .pain-q .ar { font-size: 1.25rem; }
.pain-q .missing { display: none; }
.stage[data-fit="4"] .tiles { gap: 6px; }
.stage[data-fit="4"] .tile .w { font-size: 1.15rem; }
.stage[data-fit="4"] .tile .tr { font-size: .8rem; }
.stage[data-fit="4"] .pain-q { padding-bottom: 8px; gap: 10px; }

/* contents card */
.toc-card { height: 100%; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: var(--gap, 12px); overflow-y: auto; }
.toc-card h1 { font-family: var(--display); font-weight: 500; font-size: var(--h1, 1.8rem); line-height: 1.05; letter-spacing: -.015em; margin: 0; }
.toc-card .lede { color: var(--ink-2); font-size: var(--lede, 1rem); max-width: 42ch; }
.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.toc li { border-bottom: 1px solid var(--line); }
.toc button { width: 100%; display: flex; align-items: baseline; gap: 10px; padding: var(--row, 6px) 2px; text-align: left; }
.toc .t { font-family: var(--display); font-size: var(--toc-t, 1.16rem); font-weight: 500; }
.toc .c { font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.toc .ar { margin-left: auto; color: var(--accent); font-size: var(--toc-ar, 1.05rem); white-space: nowrap; }
/* the contents card must fit one screen: it tightens step by step on smaller phones */
.toc-card[data-fit="1"] { --row: 3px; --gap: 9px; }
.toc-card[data-fit="2"] { --row: 2px; --gap: 8px; --toc-t: 1.05rem; --toc-ar: .98rem; --h1: 1.6rem; --lede: .94rem; }
.toc-card[data-fit="3"], .toc-card[data-fit="4"] { --row: 2px; --gap: 7px; --toc-t: 1.02rem; --toc-ar: .95rem; --h1: 1.5rem; --lede: .9rem; }
.toc-card[data-fit="5"] { --row: 0px; --gap: 6px; --toc-t: 1rem; --toc-ar: .92rem; --h1: 1.4rem; }
.toc-card[data-fit="3"] .quiz-entry .d, .toc-card[data-fit="4"] .quiz-entry .d, .toc-card[data-fit="5"] .quiz-entry .d { display: none; }
.toc-card[data-fit="3"] .switch, .toc-card[data-fit="4"] .switch, .toc-card[data-fit="5"] .switch { font-size: .88rem; }
.toc-card[data-fit="4"] .lede, .toc-card[data-fit="5"] .lede { display: none; }
.toc-card[data-fit="5"] .quiz-entry { padding-top: 6px; padding-bottom: 6px; }
.toc-card .foot { margin-top: auto; font-size: .85rem; color: var(--ink-2); }
.toc-card .modes { display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 359px) { .toc .ar { display: none; } }

/* listening quiz */
.quiz-entry { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 8px 14px 9px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.quiz-entry .t { font-family: var(--display); font-size: 1.16rem; font-weight: 500; }
.quiz-entry .d { grid-column: 1; font-size: .86rem; color: var(--ink-2); line-height: 1.3; }
.quiz-entry .go { grid-column: 2; grid-row: 1 / 3; font-size: 1.6rem; color: var(--accent); line-height: 1; }
.quiz { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.quiz .lead { font-family: var(--display); font-weight: 500; font-size: 1.25rem; line-height: 1.25; }
.quiz .hint { color: var(--ink-2); font-size: .95rem; }
.pools { display: grid; gap: 8px; }
.pools button { display: flex; align-items: baseline; gap: 10px; text-align: left; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.pools button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pools .t { font-family: var(--display); font-size: 1.08rem; font-weight: 500; }
.pools .c { margin-left: auto; font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.quiz .listen { display: flex; align-items: center; gap: 14px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  font-family: var(--display); font-size: 1.12rem; line-height: 1.25; transition: background .12s, border-color .12s; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--ui); font-size: .85rem; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); }
.opt .mark { margin-left: auto; flex: none; width: 22px; height: 22px; display: none; }
.opt.right { border-color: var(--accent); background: var(--accent-soft); }
.opt.right .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.opt.wrong .k { color: var(--wrong); border-color: var(--wrong); }
.opt.right .mark, .opt.wrong .mark { display: block; }
.opt.right .mark { color: var(--accent); } .opt.wrong .mark { color: var(--wrong); }
.opt[disabled] { cursor: default; }
.opt.dim { opacity: .55; }
.quiz .answer { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.quiz .answer .ar { color: var(--accent); font-size: 1.6rem; line-height: 1.6; font-weight: 500; }
.quiz .answer .tr { font-size: 1rem; font-style: italic; font-family: var(--display); }
.quiz .verdict { font-weight: 600; }
.quiz .verdict.no { color: var(--wrong); }
.quiz .verdict.yes { color: var(--accent); }
.score { font-family: var(--display); font-weight: 500; font-size: 2.6rem; line-height: 1.05; letter-spacing: -.015em; }
.missed { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.missed li { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.missed .en { font-size: 1.05rem; }
.missed .ar { color: var(--accent); font-size: 1.3rem; line-height: 1.55; }
.missed .tr { font-size: .9rem; font-style: italic; font-family: var(--display); color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
.quiz .row { display: flex; gap: 10px; flex-wrap: wrap; }
.stage .quiz { flex: 1; min-height: 0; }
.stage .quiz .answer { margin-top: auto; }
.stage .missed { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.stage[data-fit="1"] .opt, .stage[data-fit="2"] .opt { padding: 10px 12px; font-size: 1.04rem; }
.stage[data-fit="3"] .opt, .stage[data-fit="4"] .opt { padding: 8px 12px; font-size: .98rem; }
.stage[data-fit="2"] .quiz .answer .ar, .stage[data-fit="3"] .quiz .answer .ar, .stage[data-fit="4"] .quiz .answer .ar { font-size: 1.35rem; line-height: 1.5; }
.stage[data-fit="3"] .quiz, .stage[data-fit="4"] .quiz { gap: 10px; }
.stage[data-fit="3"] .opts, .stage[data-fit="4"] .opts { gap: 7px; }
.stage[data-fit="4"] .quiz .lead { font-size: 1rem; }
.stage[data-fit="4"] .quiz .hint { display: none; }
.stage[data-fit="4"] .quiz { gap: 8px; }
.stage[data-fit="4"] .opts { gap: 6px; }
.stage[data-fit="4"] .opt { padding: 6px 10px; font-size: .92rem; line-height: 1.2; gap: 10px; }
.stage[data-fit="4"] .opt .k { width: 22px; height: 22px; font-size: .78rem; }
.stage[data-fit="4"] .quiz .listen .play { width: 56px; height: 56px; }
.stage[data-fit="4"] .quiz .listen .play .glyph { width: 22px; height: 22px; }
.stage[data-fit="4"] .quiz .answer { padding-top: 8px; gap: 2px; }
.stage[data-fit="4"] .quiz .answer .ar { font-size: 1.2rem; line-height: 1.4; }
.stage[data-fit="4"] .quiz .answer .tr { font-size: .9rem; }
.stage[data-fit="4"] .quiz .verdict { font-size: .92rem; }
.stage[data-fit="3"] .missed li, .stage[data-fit="4"] .missed li { padding: 6px 0; }
.quiz-wide { max-width: 640px; display: flex; flex-direction: column; gap: 20px; }
.quiz-wide .opt { padding: 15px 18px; font-size: 1.18rem; }
.quiz-wide .answer .ar { font-size: 1.9rem; }
.rail .quiz-entry { padding: 10px 12px; }

/* pain card */
.pain-q { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.pain-q .play { width: 48px; height: 48px; }
.pain-q .play .glyph { width: 18px; height: 18px; }
.pain-q .ar { font-size: 1.45rem; color: var(--accent); line-height: 1.6; }
.pain-q .tr { font-style: italic; font-family: var(--display); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 8px 10px; text-align: center;
  display: grid; gap: 1px; justify-items: center; transition: background .12s, border-color .12s; }
.tile .d { display: flex; justify-content: space-between; width: 100%; align-items: baseline; }
.tile .w { font-family: var(--display); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }

const DATA = {"title": "Spoken Saudi Arabic for anaesthetists", "sections": [{"id": "start", "title": "Before you start", "note": null, "rows": [{"n": 1, "label": null, "en": "Peace be upon you, good morning. I'm the consultant anaesthetist, Dr Ganesh. How are you today?", "m": {"ar": "السلام عليكم، صباح الخير. أنا استشاري تخدير، دكتور غانيش. كيف حالك اليوم؟", "tr": "as-salamu alaykum, sabah al-khair. ana istishari takhdeer, duktoor Ganesh. kaif haalak il-yoom?", "src": "a/start-01-m.mp3"}, "f": {"ar": "السلام عليكم، صباح الخير. أنا استشاري تخدير، دكتور غانيش. كيف حالِك اليوم؟", "tr": "as-salamu alaykum, sabah al-khair. ana istishari takhdeer, duktoor Ganesh. kaif haalik il-yoom?", "src": "a/start-01-f.mp3"}, "same": false}, {"n": 2, "label": null, "en": "What is your name?", "m": {"ar": "وش اسمك؟", "tr": "wish ism-ak?", "src": "a/start-02-m.mp3"}, "f": {"ar": "وش اسمك؟", "tr": "wish ism-ik?", "src": "a/start-02-f.mp3"}, "same": false}, {"n": 3, "label": null, "en": "Please.", "m": {"ar": "لو سمحت", "tr": "law samaht", "src": "a/start-03-m.mp3"}, "f": {"ar": "لو سمحتي", "tr": "law samahti", "src": "a/start-03-f.mp3"}, "same": false}, {"n": 4, "label": null, "en": "Thank you.", "m": {"ar": "شكرا", "tr": "shukran", "src": "a/start-04.mp3"}, "same": true}, {"n": 5, "label": null, "en": "Yes. No.", "m": {"ar": "إيوه. لا", "tr": "eewah. la.", "src": "a/start-05.mp3"}, "same": true}, {"n": 6, "label": null, "en": "I do not speak Arabic well.", "m": {"ar": "ما أتكلم عربي زين", "tr": "ma atkallam arabi zain", "src": "a/start-06.mp3"}, "same": true}, {"n": 7, "label": null, "en": "Is there someone who speaks English?", "m": {"ar": "فيه أحد يتكلم إنجليزي؟", "tr": "feeh ahad yitkallam ingleezi?", "src": "a/start-07.mp3"}, "same": true}]}, {"id": "preop", "title": "Preoperative questions", "note": null, "rows": [{"n": 1, "label": null, "en": "Did you eat or drink anything?", "m": {"ar": "أكلت ولا شربت شي؟", "tr": "akalt wala sharabt shay?", "src": "a/preop-01-m.mp3"}, "f": {"ar : "نامي على ظهرك", "tr": "nami ala dhahrik", "src": "a/theatre-01-f.mp3"}, "same": false}, {"n": 2, "label": null, "en": "Open your mouth.", "m": {"ar": "افتح فمك", "tr": "iftah fammak", "src": "a/theatre-02-m.mp3"}, "f": {"ar": "افتحي فمك", "tr": "iftahi fammik", "src": "a/theatre-02-f.mp3"}, "same": false}, {"n": 3, "label": null, "en": "Stick out your tongue.", "m": {"ar": "طلع لسانك", "tr": "talli' lisanak", "src": "a/theatre-03-m.mp3"}, "f": {"ar": "طلعي لسانك", "tr": "talli'i lisanik", "src": "a/theatre-03-f.mp3"}, "same": false}, {"n": 4, "label": null, "en": "Breathe deeply.", "m": {"ar": "خذ نفس عميق", "tr": "khudh nafas ameeq", "src": "a/theatre-04-m.mp3"}, "f": {"ar": "خذي نفس عميق", "tr": "khudhi nafas ameeq", "src": "a/theatre-04-f.mp3"}, "same": false}, {"n": 5, "label": null, "en": "Breathe through the mask.", "m": {"ar": "تنفس من الكمامة", "tr": "tanaffas min al-kamama", "src": "a/theatre-05-m.mp3"}, "f": {"ar": "تنفسي من الكمامة", "tr": "tanaffasi min al-kamama", "src": "a/theatre-05-f.mp3"}, "same": false}, {"n": 6, "label": null, "en": "You will feel sleepy now.", "m": {"ar": "بتحس بنعاس الحين", "tr": "bithiss bi-na'as al-heen", "src": "a/theatre-06-m.mp3"}, "f": {"ar": "بتحسين بنعاس الحين", "tr": "bithisseen bi-na'as al-heen", "src": "a/theatre-06-f.mp3"}, "same": false}, {"n": 7, "label": null, "en": "Open your eyes.", "m": {"ar": "افتح عيونك", "tr": "iftah oyoonak", "src": "a/theatre-07-m.mp3"}, "f": {"ar": "افتحي عيونك", "tr": "iftahi oyoonik", "src": "a/theatre-07-f.mp3"}, "same": false}, {"n": 8, "label": null, "en": "Do not move.", "m": {"ar": "لا تتحرك", "tr": "la titaharrak", "src": "a/theatre-08-m.mp3"}, "f": {"ar": "لا تتحركين", "tr": "la titaharrakeen", "src": "a/theatre-08-f.mp3"}, "same": false}, {"n": 9, "label": null, "en": "Stay still.", "m": {"ar": "خلك ثابت", "tr": "khallak thabit", "src": "a/theatre-09-m.mp3"}, "f": {"ar": "خلك ثابتة", "tr": "khallik thabita", "src": "a/theatre-09-f.mp3"}, "same": false}, {"n": 10, "label": nul u feel sick?", "m": {"ar": "تحس بغثيان؟", "tr": "tihiss bi-ghathayan?", "src": "a/recovery-04-m.mp3"}, "f": {"ar": "تحسين بغثيان؟", "tr": "tihisseen bi-ghathayan?", "src": "a/recovery-04-f.mp3"}, "same": false}, {"n": 5, "label": null, "en": "Do you want water?", "m": {"ar": "تبي موية؟", "tr": "tabi moya?", "src": "a/recovery-05-m.mp3"}, "f": {"ar": "تبين موية؟", "tr": "tabeen moya?", "src": "a/recovery-05-f.mp3"}, "same": false}, {"n": 6, "label": null, "en": "Pain medicine is coming.", "m": {"ar": "دواء الألم جاي", "tr": "dawa al-alam jay", "src": "a/recovery-06.mp3"}, "same": true}, {"n": 7, "label": null, "en": "Your family is outside.", "m": {"ar": "أهلك برا", "tr": "ahlak barra", "src": "a/recovery-07-m.mp3"}, "f": {"ar": "أهلك برا", "tr": "ahlik barra", "src": "a/recovery-07-f.mp3"}, "same": false}, {"n": 8, "label": null, "en": "May God give you health.", "m": {"ar": "الله يعافيك", "tr": "allah ya'afeek", "src": "a/recovery-08-m.mp3"}, "f": {"ar": "الله يعافيكِ", "tr": "allah ya'afeeki", "src": "a/recovery-08-f.mp3"}, "same": false}]}, {"id": "type", "title": "Type of anaesthetic", "note": "These lines name the anaesthetic and ask for agreement. Risks and the full consent go through an interpreter.", "rows": [{"n": 1, "label": "Consent", "en": "We need your consent for the anaesthetic.", "m": {"ar": "نحتاج الموافقة على التخدير", "tr": "nihtaaj al-muwafaqa ala at-takhdeer", "src": "a/type-01.mp3"}, "same": true}, {"n": 2, "label": "General anaesthetic", "en": "We will give you a full general anaesthetic. You will sleep, and you will not feel the operation. Do you agree?", "m": {"ar": "بنسوي لك تخدير كامل. بتنام، وما بتحس بالعملية. توافق؟", "tr": "binsawwi lak takhdeer kamil. bitnaam, wa ma bithiss bil-amaliya. twaafiq?", "src": "a/type-02-m.mp3"}, "f": {"ar": "بنسوي لكِ تخدير كامل. بتنامين، وما بتحسين بالعملية. توافقين؟", "tr": "binsawwi lik takhdeer kamil. bitnameen, wa ma bithisseen bil-amaliya. twaafiqeen?", "src": "a/type-02-f.mp3"}, "same": false}, {"n": 3, "label": "Spinal", "en": "A needle in your back. You stay awake. The lower part goes numb. Do you agree?", "m": {"ar": "بنسوي لك تخدير نصفي، إبرة في الظهر. بتبقى صاحي، والجزء الي تحت راح يتخدر. توافق؟", "tr": "binsawwi lak takhdeer nusfi, ibra fil dhahr. bitibqa sahi, wal-juz' illi taht rah yitkhaddar. twaafiq?", "src": "a/type-03-m.mp3"}, "f": {"ar": "بنسوي لكِ تخدير نصفي، إبرة في الظهر. بتبقين صاحية، والجزء الي تحت راح يتخدر. توافقين؟", "tr": "binsawwi lik takhdeer nusfi, ibra fil dhahr. bitibqeen sahya, wal-juz' illi taht rah yitkhaddar. twaafiqeen?", "src": "a/type-03-f.mp3"}, "same": false}, {"n": 4, "label": "Epidural", "en": "A thin tube in your back. You stay awake, and we can give more medicine through it. Do you agree?", "m": {"ar": "بنسوي لك إبيدورال، قسطرة في الظهر. بتبقى صاحي، ونقدر نزيد الدواء من خلالها. توافق؟", "tr": "binsawwi lak ebidural, qastara fil dhahr. bitibqa sahi, wa nigdar nizeed ad-dawa min khilaalha. twaafiq?", "src": "a/type-04-m.mp3"}, "f": {"ar": "بنسوي لكِ إبيدورال، قسطرة في الظهر. بتبقين صاحية، ونقدر نزيد الدواء من خلالها. توافقين؟", "tr": "binsawwi lik ebidural, qastara fil dhahr. bitibqeen sahya, wa nigdar nizeed ad-dawa min khilaalha. twaafiqeen?", "src": "a/type-04-f.mp3"}, "same": false}, {"n": 5, "label": "Nerve block", "en": "We numb the nerve in this area with a needle, to reduce the pain. You may stay awake. Do you agree?", "m": {"ar": "بنخدر العصب في المنطقة بإبرة، عشان نخفف الألم. ممكن تبقى صاحي. توافق؟", "tr": "binkhaddir al-asab fil mantiqa bi-ibra, ashan nkhaffif al-alam. mumkin tibqa sahi. twaafiq?", "src": "a/type-05-m.mp3"}, "f": {"ar": "بنخدر العصب في المنطقة بإبرة، عشان نخفف الألم. ممكن تبقين صاحية. توافقين؟", "tr": "binkhaddir al-asab fil mantiqa bi-ibra, ashan nkhaffif al-alam. mumkin tibqeen sahya. twaafiqeen?", "src": "a/type-05-f.mp3"}, "same": false}, {"n": 6, "label": "Sedation", "en": "Medicine to relax you and make you sleepy. Not a full sleep, but you will be calm. Do you agree?", "m": {"ar": "بنعطيك  will sleep first with gas on the mask. After she is asleep, we put the needle in her hand.", "m": {"ar": "بنتك بننوّمها أول بالغاز على الكمامة، وبعد ما تنام نحط الإبرة في يدها", "tr": "bintak binnawwimha awwal bil-ghaaz ala al-kamama, wa ba'd ma tinam nhutt al-ibra fi yaddha", "src": "a/child-02-m.mp3"}, "f": {"ar": "بنتِك بننوّمها أول بالغاز على الكمامة، وبعد ما تنام نحط الإبرة في يدها", "tr": "bintik binnawwimha awwal bil-ghaaz ala al-kamama, wa ba'd ma tinam nhutt al-ibra fi yaddha", "src": "a/child-02-f.mp3"}, "same": false}, {"n": 3, "label": "Premedication, son", "en": "We will give your son medicine by mouth or nose to calm him. It takes about 30 minutes to work.", "m": {"ar": "بنعطي ولدك دواء من الفم أو الأنف عشان يهدى. ياخذ حوالي ثلاثين دقيقة عشان يشتغل", "tr": "bin'ati waldak dawa min al-fam aw al-anf ashan yahda. yakhodh hawali thalatheen daqiqa ashan yishtaghil", "src": "a/child-03-m.mp3"}, "f": {"ar": "بنعطي ولدِك دواء من الفم أو الأنف عشان يهدى. ياخذ حوالي ثلاثين دقيقة عشان يشتغل", "tr": "bin'ati waldik dawa min al-fam aw al-anf ashan yahda. yakhodh hawali thalatheen daqiqa ashan yishtaghil", "src": "a/child-03-f.mp3"}, "same": false}, {"n": 4, "label": "Premedication, daughter", "en": "We will give your daughter medicine by mouth or nose to calm her. It takes about 30 minutes to work.", "m": {"ar": "بنعطي بنتك دواء من الفم أو الأنف عشان تهدى. ياخذ حوالي ثلاثين دقيقة عشان يشتغل", "tr": "bin'ati bintak dawa min al-fam aw al-anf ashan tahda. yakhodh hawali thalatheen daqiqa ashan yishtaghil", "src": "a/child-04-m.mp3"}, "f": {"ar": "بنعطي بنتِك دواء من الفم أو الأنف عشان تهدى. ياخذ حوالي ثلاثين دقيقة عشان يشتغل", "tr": "bin'ati bintik dawa min al-fam aw al-anf ashan tahda. yakhodh hawali thalatheen daqiqa ashan yishtaghil", "src": "a/child-04-f.mp3"}, "same": false}]}, {"id": "pain", "title": "Pain score", "note": null, "rows": [{"n": 0, "m": {"ar": "صفر", "tr": "sifr", "src": "a/pain-00.mp3"}, "same": true}, {"n": 1, "m": {"ar": "واحد", "tr": "wahid",       const pr = player.play();
      if (pr && pr.catch) pr.catch(e => { if (my === token && !(e && e.name === "AbortError")) stopAudio(); });
    }, ms);
    return;
  }
  if (btn) { setBtn(btn, false); setTurn(btn, false); btn.classList.remove("loading"); }
  activeBtn = null; phase = 0; started = false;
  document.querySelectorAll(".tile.on").forEach(t => t.classList.remove("on"));
});

function playButton(form, say, extra = "") {
  if (!form || !form.src) return `<button class="play" disabled aria-label="Recording to come" title="Recording to come">${PLAY}</button><span class="missing">Recording to come</span>`;
  return `<button class="play ${extra}" data-src="${esc(form.src)}" data-say="${esc(say)}" aria-label="Play${esc(say)}">${RING}${PLAY}</button>`;
}
function chips(form) {
  return `<div class="slot"><div class="chips"><button class="chip" data-slow aria-pressed="${state.slow}">Slower</button></div><span class="cue" aria-live="polite"></span></div>`;
}
function sayBlock(sec, row, key, compact) {
  const form = formFor(row, state.who);
  if (state.practice && !state.revealed.has(key)) {
    return `<button class="reveal" data-reveal="${key}"><span>Say it in Arabic first.</span>Then tap here to check and hear it.</button>`;
  }
  const tag = tagFor(sec, row);
  return `<div class="say">
      <p class="ar" lang="ar">${esc(form.ar)}</p>
      <p class="tr" lang="ar-Latn">${esc(form.tr)}</p>
      ${tag ? `<p class="tag">${tag}</p>` : ""}
    </div>`;
}

/* ---------- phone ---------- */
let deck = [];
function buildDeck() {
  deck = [{ kind: "toc" }];
  for (const s of DATA.sections) {
    if (s.id === "pain") { deck.push({ kind: "pain", s }); continue; }
    s.rows.forEach((r, k) => deck.push({ kind: "phrase", s, r, k }));
  }
}
function whoControl(sec) {
  const labels = whoLabels(sec);
  if (!labels) {
    const t = sec.id === "pain" ? "Numbers" : sec.id === "sounds" ? "Sounds" : "To the mother";
    return `<div class="fixed-who">${t}</div>`;
  }
  return `<div class="who${sec.id === "child" || sec.id === "back" ? " kin" : ""}" role="radiogroup" aria-label="${sec.id === "back" ? "Who is speaking" : "Who you are speaking to"}">
    <button role="radio" aria-checked="${state.who === "m"}" data-who="m" aria-label="${labels[0]}"><span class="lg">${labels[0]}</span><span class="sm">${labels[2]}</span></button>
    <button role="radio" aria-checked="${state.who === "f"}" data-who="f" aria-label="${labels[1]}"><span class="lg">${labels[1]}</span><span class="sm">${labels[3]}</span></button></div>`;
}
function tocList(current) {
  return `<ol class="toc">${DATA.sections.map(s => `<li><button data-go="${s.id}" ${current === s.id ? 'aria-current="true"' : ""}>
      <span class="t">${esc(s.title)}</span><span class="c">${s.rows.length}</span><span class="ar" lang="ar">${TEASER[s.id] || ""}</span></button></li>`).join("")}</ol>`;
}
function phoneToc() {
  return `<div class="toc-card">
    <h1>${esc(DATA.title)}</h1>
    <p class="lede">${total} phrases from the anaesthetic room to recovery, each spoken by a Saudi voice.</p>
    ${tocList(null)}
    <div class="modes">${modeSwitches()}${quizEntry()}</div>
    <p class="foot">Phrases: Dr Ganesh Sivasankara · MD · FRCA · FCARCSI · Consultant Anaesthetist<br>Built with Claude (Anthropic). The phrases are mine; the voices are Fahad and Layan, made with ElevenLabs.</p>
  </div>`;
}
function modeSwitches() {
  return `<label class="switch"><input type="checkbox" id="practice" ${state.practice ? "checked" : ""}><span class="knob"></span><span><b>Test yourself:</b> Arabic hidden until you tap</span></label>
    <label class="switch"><input type="checkbox" id="repeat" ${state.repeat ? "checked" : ""}><span class="knob"></span><span><b>Listen &amp; repeat:</b> hear, say it, hear again</span></label>`;
}
function quizEntry() {
  return `<button class="quiz-entry" data-quiz="open"><span class="t">Listening quiz</span><span class="d">Hear a phrase, pick the English. Ten questions.</span><span class="go" aria-hidden="true">›</span></button>`;
}
function phonePhrase(c) {
  const { s, r, k } = c;
  const key = s.id + "-" + r.n;
  const form = formFor(r, state.who);
  const hidden = state.practice && !state.revealed.has(key);
  return `<div class="body">
      ${r.label ? `<p class="label">${esc(r.label)}${r.letters ? ` <span class="letters" lang="ar">${esc(r.letters)}</span>` : ""}</p>` : ""}
      <p class="en">${esc(r.en)}</p>
      ${sayBlock(s, r, key)}
    </div>
    <div class="actions">${hidden ? "" : playButton(form, ": " + r.en) + chips(form)}</div>`;
}
function painTiles(s) {
  return `<div class="tiles">${s.rows.map(r => {
    const f = r.m;
    return `<button class="tile" ${f.src ? `data-src="${esc(f.src)}" data-say="${esc(": " + r.n)}"` : "disabled"} aria-label="${r.n}: ${esc(f.tr)}">
      <span class="d"><span class="w">${r.n}</span><span class="e" lang="ar">${easternNum(r.n)}</span></span>
      <span class="ar" lang="ar">${esc(f.ar)}</span><span class="tr">${esc(f.tr)}</span></button>`; }).join("")}</div>`;
}
function painQuestion() {
  const th = secById("theatre"), q = th.rows.find(r => r.n === 11);
  if (!q) return "";
  const f = formFor(q, "m");
  return `<div class="pain-q">${playButton(f, ": " + q.en)}<div><p class="ar" lang="ar">${esc(f.ar)}</p><p class="tr">${esc(f.tr)}</p></div></div>`;
}
function phonePain(c) {
  return `<div class="body"><p class="en">Ask for a score from zero to ten, then tap the number you hear.</p></div>
    ${painQuestion()}${painTiles(c.s)}`;
}
/* ---------- listening quiz ---------- */
const N_Q = 10;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function quizPool(poolId) {
  const items = [];
  for (const s of DATA.sections) {
    if (s.id === "sounds" || (poolId !== "all" && s.id !== poolId)) continue;
    for (const r of s.rows) {
      const form = formFor(r, state.who);
      if (!form || !form.src) continue;
      items.push({ s, r, form, text: s.id === "pain" ? String(r.n) : r.en, number: s.id === "pain" });
    }
  }
  return items;
}
function makeQuestion(item, all) {
  const same = all.filter(x => x.s.id === item.s.id && x.text !== item.text);
  const other = all.filter(x => x.number === item.number && x.text !== item.text);
  const seen = new Set([item.text]);
  const pick = [];
  for (const src of [same, other]) {
    for (const x of shuffle(src.slice())) {
      if (pick.length >= 2) break;
      if (!seen.has(x.text)) { seen.add(x.text); pick.push(x); }
    }
    if (pick.length >= 2) break;
  }
  const options = shuffle([{ text: item.text, right: true }, ...pick.map(x => ({ text: x.text, right: false }))]);
  return { item, options, picked: null };
}
function startQuiz(poolId) {
  const all = quizPool("all");
  const pool = quizPool(poolId);
  const qs = shuffle(pool.slice()).slice(0, N_Q).map(it => makeQuestion(it, all));
  state.quiz = { stage: "q", pool: poolId, qs, i: 0, score: 0 };
}
function quizTitle(poolId) { return poolId === "all" ? "All sections" : secById(poolId).title; }
function quizSetup(q) {
  const pools = [{ id: "all", title: "All sections", n: quizPool("all").length }, ...DATA.sections.map(s => ({ id: s.id, title: s.title, n: quizPool(s.id).length })).filter(p => p.n > 0)];
  return `<div class="quiz">
    <p class="lead">Hear a phrase, pick the English.</p>
    <p class="hint">Ten questions, in the form for ${state.who === "m" ? "a man" : "a woman"}. Which phrases?</p>
    <div class="pools" role="radiogroup" aria-label="Which phrases">${pools.map(p => `<button role="radio" aria-checked="${q.pool === p.id}" data-pool="${p.id}"><span class="t">${esc(p.title)}</span><span class="c">${p.n}</span></button>`).join("")}</div>
    <div class="row"><button class="btn" data-quiz="start">Start</button></div>
  </div>`;
}
function quizQuestion(q) {
  const cur = q.qs[q.i];
  const done = cur.picked !== null;
  const right = cur.options.findIndex(o => o.right);
  const ans = cur.item;
  return `<div class="quiz" data-q="${q.i}">
    <div class="listen">${playButton(ans.form, ": question " + (q.i + 1))}<div><p class="lead">${ans.number ? "Which number did you hear?" : "What did you hear?"}</p>
      <div class="chips"><button class="chip" data-slow aria-pressed="${state.slow}">Slower</button></div></div></div>
    <div class="opts">${cur.options.map((o, k) => {
      const cls = done ? (o.right ? "opt right" : k === cur.picked ? "opt wrong" : "opt dim") : "opt";
      return `<button class="${cls}" data-opt="${k}" ${done ? "disabled" : ""}><span class="k">${k + 1}</span><span>${esc(o.text)}</span>${o.right ? TICK : CROSS}</button>`; }).join("")}</div>
    ${done ? `<div class="answer"><p class="verdict ${cur.picked === right ? "yes" : "no"}">${cur.picked === right ? "Right." : "Not this time."}</p>
      <p class="ar" lang="ar">${esc(ans.form.ar)}</p><p class="tr" lang="ar-Latn">${esc(ans.form.tr)}</p></div>` : ""}
  </div>`;
}
function quizEnd(q) {
  const missed = q.qs.filter(x => !x.options[x.picked].right);
  return `<div class="quiz">
    <p class="score">${q.score} of ${q.qs.length}</p>
    <p class="hint">${missed.length ? "The ones to listen to again:" : "Every one right."}</p>
    ${missed.length ? `<ul class="missed">${missed.map(x => `<li><span class="en">${esc(x.item.number ? "Number " + x.item.text : x.item.text)}</span><span class="ar" lang="ar">${esc(x.item.form.ar)}</span><span class="tr">${esc(x.item.form.tr)}</span></li>`).join("")}</ul>` : ""}
    <div class="row"><button class="btn" data-quiz="again">Again</button><button class="btn ghost" data-quiz="quit">${state.mode === "wide" ? "Back to the phrases" : "Contents"}</button></div>
  </div>`;
}
function quizBody() {
  const q = state.quiz;
  return q.stage === "setup" ? quizSetup(q) : q.stage === "q" ? quizQuestion(q) : quizEnd(q);
}
function quizWhere() {
  const q = state.quiz;
  return q.stage === "q" ? `${q.i + 1} of ${q.qs.length}` : q.stage === "end" ? quizTitle(q.pool) : "";
}
function answer(k) {
  const q = state.quiz;
  if (!q || q.stage !== "q") return;
  const cur = q.qs[q.i];
  if (cur.picked !== null || !cur.options[k]) return;
  cur.picked = k; if (cur.options[k].right) q.score++;
  render();
}
function quizNext() {
  const q = state.quiz;
  if (q.i + 1 >= q.qs.length) { q.stage = "end"; render(); return; }
  q.i++; render(); autoPlay();
}
function autoPlay() { const b = document.querySelector(".quiz .play[data-src]"); if (b) play(b); }

function renderPhone() {
  const c = deck[state.i];
  const sec = c.s;
  let top = "", stage = "";
  if (state.quiz) {
    const q = state.quiz;
    const pct = q.stage === "q" ? Math.round(100 * (q.i + (q.qs[q.i].picked !== null ? 1 : 0)) / q.qs.length) : q.stage === "end" ? 100 : 0;
    top = `<div class="top"><button class="back" data-quiz="quit">‹ Quit</button><p class="where"><b>Listening quiz</b>${quizWhere()}</p><span class="progress" style="width:${pct}%"></span></div>`;
    const cur = q.stage === "q" ? q.qs[q.i] : null;
    const dock = `<nav class="dock" aria-label="Quiz"><span></span>${q.stage === "setup" ? whoControl(DATA.sections[0]) : `<span class="fixed-who">${esc(quizTitle(q.pool))}</span>`}
      ${cur && cur.picked !== null ? `<button class="nav next" data-quiz="next">${q.i + 1 >= q.qs.length ? "Finish ›" : "Next ›"}</button>` : "<span></span>"}</nav>`;
    app.innerHTML = `<div class="phone">${top}<main class="stage" id="stage">${quizBody()}</main>${dock}</div>`;
    fit();
    return;
  }
  if (c.kind === "toc") {
    stage = phoneToc();
  } else {
    const pos = c.kind === "pain" ? "" : `${c.k + 1} of ${sec.rows.length}`;
    const pct = c.kind === "pain" ? 100 : Math.round(100 * (c.k + 1) / sec.rows.length);
    top = `<div class="top"><button class="back" data-toc>‹ Contents</button><p class="where"><b>${esc(sec.title)}</b>${pos}</p><span class="progress" style="width:${pct}%"></span></div>`;
    stage = c.kind === "pain" ? phonePain(c) : phonePhrase(c);
  }
  const atEnd = state.i === deck.length - 1;
  const dock = `<nav class="dock" aria-label="Cards">
      <button class="nav prev" data-prev ${state.i === 0 ? "disabled" : ""}>‹ Back</button>
      ${c.kind === "toc" ? whoControl(DATA.sections[0]) : whoControl(sec)}
      <button class="nav next" data-next ${atEnd ? "disabled" : ""}>${state.i === 0 ? "Start ›" : "Next ›"}</button></nav>`;
  app.innerHTML = `<div class="phone">${top || "<div></div>"}<main class="${c.kind === "toc" ? "" : "stage"}" id="stage">${stage}</main>${dock}</div>`;
  fit();
}
function fit() {
  const tc = document.querySelector(".toc-card");
  if (tc) { tc.dataset.fit = "0"; for (let k = 1; k <= 5 && tc.scrollHeight > tc.clientHeight + 1; k++) tc.dataset.fit = String(k); }
  const st = document.getElementById("stage");
  if (!st || !st.classList.contains("stage")) return;
  st.dataset.fit = "0";
  for (let k = 1; k <= 4 && st.scrollHeight > st.clientHeight + 1; k++) st.dataset.fit = String(k);
}

/* ---------- wide ---------- */
function wideCard(s, r) {
  const key = s.id + "-" + r.n;
  const form = formFor(r, state.who);
  const hidden = state.practice && !state.revealed.has(key);
  return `<article class="card" id="${key}">
      <div class="head"><span class="n">${r.n}</span>${r.label ? `<span class="label">${esc(r.label)}${r.letters ? ` <span class="letters" lang="ar">${esc(r.letters)}</span>` : ""}</span>` : ""}</div>
      <p class="en">${esc(r.en)}</p>
      ${sayBlock(s, r, key)}
      ${hidden ? "" : `<div class="actions">${playButton(form, ": " + r.en)}<div class="slot"><div class="chips"></div><span class="cue" aria-live="polite"></span></div></div>`}
    </article>`;
}
function renderWide() {
  const s = secById(state.sec);
  const idx = DATA.sections.indexOf(s);
  const nxt = DATA.sections[idx + 1];
  const labels = whoLabels(s);
  const body = s.id === "pain"
    ? `<div class="pain-wide">${painQuestion()}${painTiles(s)}</div>`
    : `<div class="grid">${s.rows.map(r => wideCard(s, r)).join("")}</div>`;
  app.innerHTML = `<div class="wide">
    <aside class="rail">
      <h1>${esc(DATA.title)}</h1>
      <p class="lede">${total} phrases from the anaesthetic room to recovery, each one spoken by a Saudi voice.</p>
      <div class="group"><span class="k">${labels ? (s.id === "back" ? "Who is speaking" : "Speaking") : s.id === "pain" ? "Numbers are the same for everyone" : s.id === "sounds" ? "Examples from the phrases" : "Said to the mother of a boy"}</span>${labels ? whoControl(s) : ""}</div>
      <div class="group">
        <button class="chip" data-slow aria-pressed="${state.slow}">Play slower</button>
        ${modeSwitches()}
        ${quizEntry()}
      </div>
      <nav aria-label="Sections">${tocList(state.quiz ? null : s.id)}</nav>
      <div class="foot"><span>Phrases by Dr Ganesh Sivasankara · MD · FRCA · FCARCSI · Consultant Anaesthetist.</span><span>Built with Claude (Anthropic). The phrases are mine; the voices are Fahad and Layan, made with ElevenLabs.</span><span>Updated 26 October 2026.</span><span>This page keeps nothing about you and sends nothing anywhere.</span><span>© 2026 Ganesh Sivasankara. Shared under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>: you may share it unchanged, with credit, but not for commercial use.</span><span>Spotted an error? <a href="https://www.linkedin.com/in/ganeshsivasankara" target="_blank" rel="noopener">Message me on LinkedIn</a>.</span></div>
    </aside>
    <main class="sheet">
      ${state.quiz ? `<header class="sec-head"><h2>Listening quiz</h2><p class="meta">${esc(state.quiz.stage === "setup" ? "Hear a phrase, pick the English" : quizTitle(state.quiz.pool) + (state.quiz.stage === "q" ? " · question " + quizWhere() : ""))}</p></header>
        <div class="quiz-wide">${quizBody()}
        ${state.quiz.stage === "q" && state.quiz.qs[state.quiz.i].picked !== null ? `<div class="row"><button class="btn" data-quiz="next">${state.quiz.i + 1 >= state.quiz.qs.length ? "Finish ›" : "Next ›"}</button><button class="btn ghost" data-quiz="quit">Quit</button></div>` : state.quiz.stage === "q" ? `<div class="row"><button class="btn ghost" data-quiz="quit">Quit</button></div>` : ""}</div>`
      : `<header class="sec-head"><h2>${esc(s.title)}</h2><p class="meta">${s.rows.length} ${s.id === "pain" ? "numbers" : s.id === "sounds" ? "sounds" : "phrases"}</p>${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}</header>
      ${body}
      ${nxt ? `<div class="sec-foot"><button data-go="${nxt.id}">Next: ${esc(nxt.title)} ›</button></div>` : ""}`}
    </main></div>`;
}

/* ---------- control ---------- */
function isWide() { return window.innerWidth >= 760; }
function render() {
  stopAudio();
  state.mode = isWide() ? "wide" : "phone";
  if (state.mode === "wide") renderWide(); else renderPhone();
  warmAround();
}
function goSection(id) {
  state.revealed.clear(); state.quiz = null;
  if (state.mode === "wide") { state.sec = id; render(); window.scrollTo(0, 0); return; }
  state.i = deck.findIndex(c => c.s && c.s.id === id);
  render();
}
function quizAction(a) {
  if (a === "open") { state.quiz = { stage: "setup", pool: state.quiz ? state.quiz.pool : "all" }; render(); window.scrollTo(0, 0); return; }
  if (a === "start" || a === "again") { startQuiz(state.quiz ? state.quiz.pool : "all"); render(); window.scrollTo(0, 0); autoPlay(); return; }
  if (a === "next") { quizNext(); return; }
  if (a === "quit") { state.quiz = null; if (state.mode !== "wide") state.i = 0; render(); window.scrollTo(0, 0); }
}
function step(d) {
  const j = state.i + d;
  if (j < 0 || j >= deck.length) return;
  state.i = j; state.revealed.clear();
  const c = deck[j]; if (c.s) state.sec = c.s.id;
  render();
}
app.addEventListener("click", e => {
  const b = e.target.closest("button, input");
  if (!b) return;
  if (b.matches(".play[data-src]")) { play(b); return; }
  if (b.matches(".tile[data-src]")) { const on = activeBtn === b && (phase === 2 || !player.paused); play(b); if (!on) b.classList.add("on"); return; }
  if (b.dataset.who) { state.who = b.dataset.who; render(); return; }
  if (b.hasAttribute("data-next")) { step(1); return; }
  if (b.hasAttribute("data-prev")) { step(-1); return; }
  if (b.hasAttribute("data-toc")) { state.i = 0; render(); return; }
  if (b.dataset.go) { goSection(b.dataset.go); return; }
  if (b.dataset.quiz) { quizAction(b.dataset.quiz); return; }
  if (b.dataset.pool) { state.quiz.pool = b.dataset.pool; render(); return; }
  if (b.dataset.opt !== undefined) { answer(+b.dataset.opt); return; }
  if (b.hasAttribute("data-slow")) { state.slow = !state.slow; player.playbackRate = state.slow ? 0.75 : 1;
    document.querySelectorAll("[data-slow]").forEach(x => x.setAttribute("aria-pressed", String(state.slow))); return; }
  if (b.dataset.reveal) {
    state.revealed.add(b.dataset.reveal); render();
    const holder = state.mode === "wide" ? document.getElementById(b.dataset.reveal) : document;
    const p = holder && holder.querySelector(".play[data-src]"); if (p) play(p);
    return;
  }
});
app.addEventListener("change", e => {
  if (e.target.id === "practice") { state.practice = e.target.checked; state.revealed.clear(); render(); }
  if (e.target.id === "repeat") { state.repeat = e.target.checked; document.querySelectorAll("#repeat").forEach(x => { x.checked = state.repeat; }); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (state.quiz) {
    const q = state.quiz;
    if (q.stage === "q" && e.key === "ArrowRight" && q.qs[q.i].picked !== null) quizNext();
    else if (q.stage === "q" && /^[1-3]$/.test(e.key)) answer(+e.key - 1);
    return;
  }
  if (state.mode !== "phone") return;
  if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
});
let sx = 0, sy = 0;
app.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
app.addEventListener("touchend", e => {
  if (state.mode !== "phone" || state.quiz) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive: true });
let rz = 0;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
  const m = isWide() ? "wide" : "phone";
  if (m !== state.mode) render(); else if (m === "phone") fit();
}, 120); });

buildDeck();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.mode === "phone") fit(); });
</script>
